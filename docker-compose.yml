services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: unisson_app
    restart: unless-stopped
    env_file:
      - .env
    environment:
      - NODE_ENV=production
      - PORT=3000
    volumes:
      - app_data:/app/data
    networks:
      - unisson_network
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:3000/api/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s

  nginx:
    image: nginx:alpine
    container_name: unisson_nginx
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
      - certbot_etc:/etc/letsencrypt:ro
      - certbot_var:/var/www/certbot:ro
    # Recharge Nginx toutes les 6 h pour prendre en compte un certificat renouvelé
    # (lu dans /etc/letsencrypt/unisson/, installé par certbot/install-cert.py).
    command: "/bin/sh -c 'while :; do sleep 6h & wait $${!}; nginx -s reload; done & exec nginx -g \"daemon off;\"'"
    depends_on:
      - app
    networks:
      - unisson_network

  certbot:
    image: certbot/certbot
    container_name: unisson_certbot
    # Doit survivre aux redémarrages du VPS, sinon plus aucun renouvellement.
    restart: unless-stopped
    volumes:
      - certbot_etc:/etc/letsencrypt
      - certbot_var:/var/www/certbot
      - ./certbot:/opt/unisson:ro
    entrypoint: "/bin/sh -c 'trap exit TERM; while :; do certbot renew --deploy-hook \"python3 /opt/unisson/install-cert.py\"; python3 /opt/unisson/install-cert.py; sleep 12h & wait $${!}; done;'"
    networks:
      - unisson_network

volumes:
  app_data:
    driver: local
  certbot_etc:
    driver: local
  certbot_var:
    driver: local

networks:
  unisson_network:
    driver: bridge
