# ==============================================================================
# UNISSON — Association Éducation Solidaire
# Configuration Nginx Reverse Proxy avec redirections 301 canoniques & Sécurité
# ==============================================================================

# Limitation de débit pour protéger les formulaires et l'API
limit_req_zone $binary_remote_addr zone=api_limit:10m rate=10r/s;
limit_req_zone $binary_remote_addr zone=emergency_limit:10m rate=5r/s;

# ------------------------------------------------------------------------------
# 1. Redirection HTTP vers HTTPS & Validation Certbot Let's Encrypt
# ------------------------------------------------------------------------------
server {
    listen 80;
    listen [::]:80;
    server_name education-solidaire.org www.education-solidaire.org
                education-solidaire.fr www.education-solidaire.fr
                education-solidaire.eu www.education-solidaire.eu;

    # Défi ACME Let's Encrypt
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    # Redirection permanente vers HTTPS canonique
    location / {
        return 301 https://education-solidaire.org$request_uri;
    }
}

# ------------------------------------------------------------------------------
# 2. Redirections 301 secondaires (domaines .fr, .eu et sous-domaine www) vers https://education-solidaire.org
# ------------------------------------------------------------------------------
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name www.education-solidaire.org
                education-solidaire.fr www.education-solidaire.fr
                education-solidaire.eu www.education-solidaire.eu;

    ssl_certificate /etc/letsencrypt/live/education-solidaire.org/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/education-solidaire.org/privkey.pem;

    return 301 https://education-solidaire.org$request_uri;
}

# ------------------------------------------------------------------------------
# 3. Serveur Principal Canonique : https://education-solidaire.org
# ------------------------------------------------------------------------------
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name education-solidaire.org;

    # Certificats SSL
    ssl_certificate /etc/letsencrypt/live/education-solidaire.org/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/education-solidaire.org/privkey.pem;

    # Protocoles & Ciphers modernes (Mozilla Intermediate)
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers 'ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:DHE-RSA-AES128-GCM-SHA256:DHE-RSA-AES256-GCM-SHA384';
    ssl_prefer_server_ciphers off;
    ssl_session_timeout 1d;
    ssl_session_cache shared:SSL:10m;
    ssl_session_tickets off;

    # En-têtes de Sécurité HTTP Renforcés
    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

    # Compression GZIP
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types text/plain text/css text/xml text/javascript application/json application/javascript application/xml+rss application/atom+xml image/svg+xml;

    # Défi ACME Let's Encrypt
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    # Protection & Rate Limiting sur l'API d'Urgence
    location /api/emergency/alert {
        limit_req zone=emergency_limit burst=10 nodelay;
        proxy_pass http://app:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Protection & Rate Limiting sur l'API HelloAsso Checkout
    location /api/helloasso/ {
        limit_req zone=api_limit burst=20 nodelay;
        proxy_pass http://app:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Proxy vers l'application Node.js / Express
    location / {
        proxy_pass http://app:3000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_cache_bypass $http_upgrade;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Timeouts
        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
    }
}
